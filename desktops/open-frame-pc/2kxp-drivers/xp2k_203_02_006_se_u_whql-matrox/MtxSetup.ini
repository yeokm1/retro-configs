[SETUP]
PackageName = Matrox PowerDesk-SE
InstallPowerDeskVisible = false
InstallPowerDesk = true
IniFormatVersion=2.0

[FAMILY]
mtxparu.inf = Matrox Parhelia & Millennium P650/P750, version 1.12.00.110
mtxpar.inf  = Matrox Parhelia & Millennium P650/P750, version 2.03.02.006
G550.inf    = Matrox G550 Series, version 5.96.004
G450.inf    = Matrox G450 Series, version 5.96.004
G450MMS.inf = Matrox G450MMS, version 5.96.004
G400.inf    = Matrox G400 Series, version 5.96.004
G200.inf    = Matrox G200 Series, version 5.96.004
G200MMS.inf = Matrox G200MMS, version 5.96.004

[Powerdesk]
PowerDeskInstallCommand     = msiexec /I PDeskSE.msi /q REBOOT=ReallySuppress
PowerDeskInstallCommand.FRE = msiexec /I PDeskSE.msi /q TRANSFORMS=French.mst REBOOT=ReallySuppress
PowerDeskInstallCommand.GER = msiexec /I PDeskSE.msi /q TRANSFORMS=German.mst REBOOT=ReallySuppress
PowerDeskInstallCommand.ITA = msiexec /I PDeskSE.msi /q TRANSFORMS=Italian.mst REBOOT=ReallySuppress
PowerDeskInstallCommand.SPA = msiexec /I PDeskSE.msi /q TRANSFORMS=Spanish.mst REBOOT=ReallySuppress
PowerdeskSetupErrorValueName = PDSE_ERROR

[DelReg]
HKLM:"Software\Matrox\PowerDesk SE\1.1"

